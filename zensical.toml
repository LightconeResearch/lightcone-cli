[project]
site_name = "lightcone-cli"
site_description = "Execution layer for ASTRA research pipelines"
site_author = "Lightcone Research Team"
repo_url = "https://github.com/LightconeResearch/lightcone-cli"
repo_name = "LightconeResearch/lightcone-cli"
copyright = "&copy; 2026 Lightcone Research"
docs_dir = "docs"
extra_css = ["stylesheets/extra.css"]

nav = [
  {"Home" = "index.md"},
  {"User Guide" = [
    {"Welcome" = "user/index.md"},
    {"Install" = "user/install.md"},
    {"Getting Started" = "user/getting-started.md"},
    {"The Environment" = "user/environment.md"},
    {"Troubleshooting" = "user/troubleshooting.md"},
    {"Glossary" = "user/glossary.md"},
  ]},
  {"Developer Corner" = [
    {"Welcome" = "maintainer.md"},
    {"Architecture" = "architecture.md"},
    {"CLI Reference" = [
      {"Overview" = "cli/index.md"},
      {"lc init" = "cli/init.md"},
      {"lc materialize" = "cli/materialize.md"},
      {"lc run" = "cli/run.md"},
      {"lc build" = "cli/build.md"},
      {"lc status" = "cli/status.md"},
      {"lc verify" = "cli/verify.md"},
      {"lc export" = "cli/export.md"},
    ]},
    {"Python API" = "api/index.md"},
    {"Contributing" = [
      {"Development Setup" = "contributing/setup.md"},
      {"Testing" = "contributing/testing.md"},
    ]},
  ]},
  {"ASTRA docs" = "https://astra-spec.org/latest/"},
]

[project.theme]
variant = "modern"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
]

[[project.theme.palette]]
scheme      = "default"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme      = "slate"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
