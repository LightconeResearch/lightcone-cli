# Sender for LightconeResearch/lightcone-bench (source: senders/ in that repo; setup in its docs/pr-triggered-benchmarks.md).
# Comment "/benchmark" on a PR (maintainers only) to benchmark that PR's stack on
# demand — a draft PR, or a re-run — with the skills from agent-skills main
# installed (the skills axis is held fixed here; varying it is the agent-skills
# senders' job). One comment on the PR links the run and is edited with the
# outcome when it ends (checked every 10 minutes).
name: benchmark-on-comment
on:
  issue_comment:
    types: [created]
concurrency:
  group: benchmark-watch-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  dispatch:
    if: >
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/benchmark') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve PR head sha
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "${{ github.event.issue.pull_request.url }}" | jq -r .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Dispatch lightcone-bench (stack under test = PR head)
        env:
          GH_TOKEN: ${{ secrets.BENCH_DISPATCH_TOKEN }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/LightconeResearch/lightcone-bench/actions/workflows/benchmark.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"task\":\"lightcone-cli/snae-build\",\"use_skills\":\"true\",\"stack_ref\":\"$SHA\"}}"
      - name: Ack with a rocket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -d '{"content":"rocket"}'
      - name: Link the run on the PR and report its outcome
        env:
          BENCH_TOKEN: ${{ secrets.BENCH_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: bash .github/scripts/bench_watch.sh
