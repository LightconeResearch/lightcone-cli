name: Lint

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is not in the default set, and this job is gated
    # on `draft == false` — so without it a PR opened as a draft and then
    # marked ready never runs at all until someone happens to push again.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
          activate-environment: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff
        run: ruff check src/ tests/

      - name: Mypy
        run: mypy src/

  lockfile:
    # Fails when actions.lock is out of sync with the workflows, or a
    # locked commit no longer verifies upstream. After any `uses:` edit,
    # regenerate it with `gh actions-lock`.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5.1.0
        with:
          persist-credentials: false

      - run: gh extension install github/gh-actions-lock --pin v0.4.1

      - run: gh actions-lock --verify
