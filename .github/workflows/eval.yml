name: Eval

# Minimal agentic eval: scaffold a project from the eval seed on the
# runner, let Claude Code (with the astra plugin) build it using the
# branch's lc/astra, then check the results with astra validate and
# lc status.

on:
  pull_request:
  workflow_dispatch:

# Only one eval per PR at a time — cancel in-progress runs
concurrency:
  group: eval-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Install lightcone-cli (branch under test)
        run: |
          uv sync
          # Scientific deps the task's analysis scripts will need — the
          # agent can add more with `uv pip install`
          uv pip install numpy scipy matplotlib

      - name: Install Claude Code + astra plugin
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          # Skip first-run onboarding in headless mode
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"
          claude plugin marketplace add LightconeResearch/agent-skills
          claude plugin install astra@lightcone-research

      - name: Set up eval project
        run: |
          project="$RUNNER_TEMP/eval-project"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          lc init "$project"
          # Overlay the task seed (astra.yaml, data/) on the scaffold
          cp -r evals/tasks/snae/. "$project"/
          cd "$project"
          # Regenerate baseline.yaml from the task astra.yaml's defaults —
          # the scaffolded one matches the boilerplate spec, not the task's
          rm -f universes/baseline.yaml
          astra universe generate -n baseline \
            -d 'Default configuration using standard practices'

      - name: Run Claude Code
        id: agent
        working-directory: ${{ env.PROJECT }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          # Transcript goes outside the project so the agent's git
          # status stays clean; uploaded via the agent-trace artifact
          claude -p "$(cat "$GITHUB_WORKSPACE/evals/prompt.md")" \
            --output-format stream-json --verbose \
            --dangerously-skip-permissions \
            --max-turns 200 \
            | tee "$RUNNER_TEMP/claude-transcript.jsonl"

      - name: Check results
        id: check
        working-directory: ${{ env.PROJECT }}
        run: |
          astra validate astra.yaml
          lc status --universe baseline
          # Fail unless every materializable output is ok
          lc status --json | jq -e \
            '[.universes[].outputs[] | select(.status != "alias")]
             | length > 0 and all(.status == "ok")'

      - name: Build report
        if: always()
        run: |
          transcript="$RUNNER_TEMP/claude-transcript.jsonl"
          if [ -s "$transcript" ]; then
            python3 .github/scripts/trace_digest.py \
              "$transcript" "$RUNNER_TEMP/agent-trace.md" > "$RUNNER_TEMP/metrics.env"
            source "$RUNNER_TEMP/metrics.env"
          fi

          icon="✅"
          [ "${{ steps.check.outcome }}" = "success" ] || icon="❌"
          {
            echo "## $icon Eval"
            echo ""
            echo "<!-- lightcone-eval-report -->"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Outputs check | ${{ steps.check.outcome }} |"
            echo "| Agent run | ${{ steps.agent.outcome }} |"
            echo "| Turns | ${turns:-?} |"
            echo "| Tool calls | ${tool_calls:-?} |"
            echo "| Cost | \$${cost:-?} |"
            echo "| Agent wall time | ${duration:-?} |"
            echo "| Model | ${model:-?} |"
            echo ""
            echo '<details><summary>lc status</summary>'
            echo ""
            echo '```'
            (cd "$PROJECT" && lc status --universe baseline) || echo "unavailable"
            echo '```'
            echo ""
            echo '</details>'
            echo ""
            echo "Full trace: \`agent-trace\` artifact on [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          } > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/comment.md`, 'utf8');
            const marker = '<!-- lightcone-eval-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload agent trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-trace
          path: |
            ${{ runner.temp }}/claude-transcript.jsonl
            ${{ runner.temp }}/agent-trace.md
          if-no-files-found: warn

      - name: Upload eval project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-project
          path: ${{ env.PROJECT }}
          # Keep .lightcone-manifest.json provenance files in the artifact
          include-hidden-files: true
          if-no-files-found: warn
