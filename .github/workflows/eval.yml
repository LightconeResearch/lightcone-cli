name: Eval

# Minimal agentic eval: scaffold a project from the eval seed on the
# runner, let Claude Code (with the astra plugin) build it using the
# branch's lc/astra, then check the results with astra validate and
# lc status.

on:
  pull_request:
  workflow_dispatch:

# Only one eval per PR at a time — cancel in-progress runs
concurrency:
  group: eval-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Install lightcone-cli (branch under test)
        run: |
          uv sync
          # Scientific deps the task's analysis scripts will need — the
          # agent can add more with `uv pip install`
          uv pip install numpy scipy matplotlib

      - name: Install Claude Code + astra plugin
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          # Skip first-run onboarding in headless mode
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"
          claude plugin marketplace add LightconeResearch/agent-skills
          claude plugin install astra@lightcone-research

      - name: Set up eval project
        run: |
          project="$RUNNER_TEMP/eval-project"
          echo "PROJECT=$project" >> "$GITHUB_ENV"
          git config user.name Eval && git config user.email eval@lightcone
          lc init "$project"
          # Overlay the task seed (astra.yaml, data/) on the scaffold
          cp -r evals/tasks/snae/. "$project"/
          cd "$project"
          # Regenerate baseline.yaml from the task astra.yaml's defaults —
          # the scaffolded one matches the boilerplate spec, not the task's
          rm -f universes/baseline.yaml
          astra universe generate -n baseline \
            -d 'Default configuration using standard practices'
          git add -A && git commit -qm seed

      - name: Run Claude Code
        working-directory: ${{ env.PROJECT }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -o pipefail
          claude -p "$(cat "$GITHUB_WORKSPACE/evals/prompt.md")" \
            --output-format stream-json --verbose \
            --dangerously-skip-permissions \
            --max-turns 200 \
            | tee claude-transcript.jsonl

      - name: Check results
        working-directory: ${{ env.PROJECT }}
        run: |
          astra validate astra.yaml
          {
            echo '## Eval: lc status'
            echo '```'
            lc status --universe baseline
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          lc status --universe baseline
          # Fail unless every materializable output is ok
          lc status --json | jq -e \
            '[.universes[].outputs[] | select(.status != "alias")]
             | length > 0 and all(.status == "ok")'

      - name: Upload eval project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-project
          path: ${{ env.PROJECT }}
          # Keep .lightcone-manifest.json provenance files in the artifact
          include-hidden-files: true
          if-no-files-found: warn
