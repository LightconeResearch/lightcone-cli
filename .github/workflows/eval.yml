name: Eval

# Agentic eval on Harbor. A task from LightconeResearch/lightcone-evals runs
# against the lightcone-cli and agent-skills under test: prepare pins the
# task image to the lightcone-cli commit and collects the skills, oracle
# requires the scripted solution to score 1.0, agents runs each harness with
# the skills installed, and report gates on reward, breakage and agent steps
# against main's history, then posts a trace analysis.
#
# agent-skills reuses it, with its own PR as the side under test:
#
#   jobs:
#     eval:
#       uses: LightconeResearch/lightcone-cli/.github/workflows/eval.yml@main
#       secrets: inherit
#
# The caller needs `pull-requests: write` and `actions: read`, the same
# triggers as below, and a REPO_READ_TOKEN that can read lightcone-evals.

on:
  workflow_dispatch:
    inputs:
      stack_ref:
        description: "lightcone-cli ref, when it is not the triggering repository"
        default: main
      skills_ref:
        description: "agent-skills ref, when it is not the triggering repository"
        default: main
      tasks_ref:
        description: "lightcone-evals ref to fetch the task from"
        default: main
  workflow_call:
    inputs:
      stack_ref: { type: string, default: main }
      skills_ref: { type: string, default: main }
      tasks_ref: { type: string, default: main }
  pull_request:
    # `ready_for_review` beside the defaults, so flipping a draft to ready
    # triggers the run the draft guard below skips.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Only one eval per PR at a time — cancel in-progress runs
concurrency:
  group: eval-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  HARBOR_VERSION: 0.22.0
  TASK: lightcone-cli/snae-build
  STACK_REPO: LightconeResearch/lightcone-cli
  SKILLS_REPO: LightconeResearch/agent-skills

jobs:
  prepare:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The triggering repository at its commit, with the history that
      # describes the change; the other at its input ref
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.STACK_REPO }}
          ref: ${{ github.repository == env.STACK_REPO && (github.event.pull_request.head.sha || github.sha) || inputs.stack_ref || 'main' }}
          fetch-depth: ${{ github.repository == env.STACK_REPO && '0' || '1' }}
          path: stack

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ github.repository == env.SKILLS_REPO && (github.event.pull_request.head.sha || github.sha) || inputs.skills_ref || 'main' }}
          fetch-depth: ${{ github.repository == env.SKILLS_REPO && '0' || '1' }}
          path: skills

      - name: Check out lightcone-evals (private)
        uses: actions/checkout@v4
        with:
          repository: LightconeResearch/lightcone-evals
          ref: ${{ inputs.tasks_ref || 'main' }}
          token: ${{ secrets.REPO_READ_TOKEN }}
          path: evals

      - name: Assemble the eval inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p bundle/skills
          cp stack/.github/scripts/eval_report.py stack/evals/trace-analysis-prompt.md bundle/

          # The task image installs lightcone-cli at its ARG LIGHTCONE_COMMIT=
          cp -r "evals/$TASK" bundle/task
          stack_sha=$(git -C stack rev-parse HEAD)
          grep -q '^ARG LIGHTCONE_COMMIT=' bundle/task/environment/Dockerfile \
            || { echo "::error::$TASK does not pin lightcone-cli with ARG LIGHTCONE_COMMIT="; exit 1; }
          sed -i "s|^ARG LIGHTCONE_COMMIT=.*|ARG LIGHTCONE_COMMIT=$stack_sha|" bundle/task/environment/Dockerfile

          # The built skill bundles, first of each name (plugins bundle
          # their dependencies, so one skill can appear twice)
          for d in skills/plugins/*/skills/*/; do
            name=$(basename "$d")
            [ -e "bundle/skills/$name" ] || cp -r "$d" "bundle/skills/$name"
          done

          changed=stack
          [ "${GITHUB_REPOSITORY,,}" = "${SKILLS_REPO,,}" ] && changed=skills
          jq -n --arg stack "$(git -C stack rev-parse --short HEAD)" \
            --arg skills "$(git -C skills rev-parse --short HEAD)" \
            --arg tasks "$(git -C evals rev-parse --short HEAD)" \
            --arg sha "$(git -C "$changed" rev-parse HEAD)" \
            '{"lightcone-cli": $stack, "agent-skills": $skills, "lightcone-evals": $tasks, sha: $sha}' \
            | tee bundle/refs.json

          # What the analyst can blame a change in behaviour on
          if [ -n "$BASE_SHA" ] && git -C "$changed" cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            { echo '```'
              git -C "$changed" log --oneline "$BASE_SHA..HEAD" | head -50
              git -C "$changed" diff --stat "$BASE_SHA...HEAD" | tail -40
              echo '```'; } > bundle/changes.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: eval-inputs
          path: bundle

  oracle:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-inputs
          path: bundle
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install "harbor==$HARBOR_VERSION"
      - name: Run the reference solution
        run: harbor run -p bundle/task -a oracle -e docker -o jobs --job-name oracle -q -y
      - name: Require reward 1.0
        run: |
          jq -e '[.stats.evals[] | (.n_errors // 0) == 0 and (.metrics[0].reward // 0) == 1.0]
                 | length > 0 and all' jobs/oracle/result.json \
            || { jq .stats jobs/oracle/result.json; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-oracle
          path: jobs

  agents:
    needs: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: claude-code, model: claude-sonnet-5-5, secret: CLAUDE_CODE_OAUTH_TOKEN }
          - { leg: codex, model: gpt-5.1-codex, secret: OPENAI_API_KEY }
    steps:
      - name: Skip without the leg's secret
        id: gate
        env:
          KEY: ${{ secrets[matrix.secret] }}
        run: |
          mkdir -p "jobs/${{ matrix.leg }}"
          skipped=false
          [ -n "$KEY" ] || { skipped=true; echo "::notice::Skipping ${{ matrix.leg }}: ${{ matrix.secret }} is not set"; }
          echo "skip=$skipped" >> "$GITHUB_OUTPUT"
          jq -n --arg leg "${{ matrix.leg }}" --argjson skipped "$skipped" \
            --arg reason "${{ matrix.secret }} not set" \
            '{leg: $leg, skipped: $skipped, skip_reason: $reason}' > "jobs/${{ matrix.leg }}/leg.json"
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          name: eval-inputs
          path: bundle
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.skip == 'false'
      - if: steps.gate.outputs.skip == 'false'
        run: uv tool install "harbor==$HARBOR_VERSION"
      - name: Run the agent
        if: steps.gate.outputs.skip == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_MAX_TURNS: "200"
        run: |
          skills=(); for d in bundle/skills/*/; do skills+=(--skill "${d%/}"); done
          harbor run -p bundle/task -a "${{ matrix.leg }}" -m "${{ matrix.model }}" "${skills[@]}" \
            -e docker -o "jobs/${{ matrix.leg }}" --job-name "${{ matrix.leg }}" -q -y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-leg-${{ matrix.leg }}
          path: jobs/${{ matrix.leg }}

  report:
    needs: [prepare, oracle, agents]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-inputs
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-leg-*
          path: collected

      - name: Fetch the history from main's latest successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" --branch main \
                 --event push --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n eval-results -D baseline \
            || echo "::notice::No main history yet"

      - name: Summarize
        run: |
          mode=pr
          [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ] && mode=main
          mkdir -p collected
          python3 bundle/eval_report.py summarize --jobs collected --out report --task bundle/task \
            --baseline baseline --refs bundle/refs.json --changes bundle/changes.md \
            --oracle "${{ needs.oracle.result }}" --mode "$mode"

      - name: Analyse the traces
        id: analysis
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # The analysis is part of the result: a leg without one fails the job
          ls report/analysis-input-*.md >/dev/null 2>&1 || exit 0
          curl -fsSL https://claude.ai/install.sh | bash
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"
          status=ok
          for input in report/analysis-input-*.md; do
            leg=${input#report/analysis-input-}; leg=${leg%.md}
            timeout 600 "$HOME/.local/bin/claude" -p "$(cat bundle/trace-analysis-prompt.md)" \
              < "$input" > "report/analysis-$leg.md" && [ -s "report/analysis-$leg.md" ] \
              || { echo "::error::trace analysis failed for $leg"; status=failed; }
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Build the report
        if: always()
        run: |
          python3 bundle/eval_report.py comment --out report
          cat report/comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: report

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // GitHub rejects comments over 65536 characters
            const body = fs.readFileSync('report/comment.md', 'utf8').slice(0, 65000)
              + `\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- lightcone-eval-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Gate
        run: |
          jq -r '.gate.reasons[]' report/results.json
          jq -e '.gate.ok' report/results.json > /dev/null
          [ "${{ steps.analysis.outputs.status }}" != failed ]
