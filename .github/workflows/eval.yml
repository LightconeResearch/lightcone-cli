name: Eval

# The agentic eval, hosted in LightconeResearch/lightcone-evals beside the
# task it runs; see that workflow's header and README. This repository is
# the side under test: its commit pins the task image and its secrets run
# the legs.

on:
  pull_request:
    # `ready_for_review` beside the defaults, so flipping a draft to ready
    # triggers the run the draft guard skips
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    uses: LightconeResearch/lightcone-evals/.github/workflows/eval.yml@main
    secrets: inherit
    with:
      stack_ref: ${{ github.event.pull_request.head.sha || github.sha }}
