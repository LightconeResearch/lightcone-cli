name: Eval

# Agentic eval on Harbor: the task in evals/snae-build is run by real agent
# harnesses against the lightcone-cli and agent-skills under test, and every
# run explains itself from its trace.
#
#   prepare  build the engine wheel into the task, collect the skill bundles
#   oracle   the task's scripted solution must score 1.0 — no LLM involved
#   agents   one Harbor job per harness, the skills installed with --skill
#   report   rewards, agent steps against main's history, the trace analysis,
#            the PR comment; red on a failed gate or a missing analysis
#
# The step gate: a leg whose mean agent steps exceed the median of its last
# runs on main by more than `tolerance` fails. Main runs record that history
# (in the eval-results artifact of the newest successful main run) and gate
# on reward only, so the reference follows main.
#
# Reuse from LightconeResearch/agent-skills, where the skills are the side
# under test and the stack is lightcone-cli main:
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#     pull-requests: write
#     actions: read
#   jobs:
#     eval:
#       uses: LightconeResearch/lightcone-cli/.github/workflows/eval.yml@main
#       secrets: inherit
#
# Whichever of the two repositories triggered the run is checked out at the
# triggering commit; the other at its input ref. Each repository keeps its
# own history, because the baseline is looked up in the triggering one.
#
# Limits: --skill installs SKILL.md bundles only, not the plugins' hooks
# (agent-skills' e2e-hooks workflow covers those); step counts compare within
# a leg only, since harness tool vocabularies differ; at attempts=1 the step
# comparison is coarse, which is what the median and the tolerance absorb.
# A leg whose secret is absent is skipped with a notice, and a run in which
# no leg ran fails.

on:
  workflow_dispatch:
    inputs:
      stack_ref:
        description: "lightcone-cli ref to evaluate when it is not the triggering repository"
        type: string
        default: main
      skills_ref:
        description: "agent-skills ref to install when it is not the triggering repository"
        type: string
        default: main
      attempts:
        description: "Trials per leg"
        type: string
        default: "1"
      tolerance:
        description: "Allowed fractional increase of agent steps over main's median"
        type: string
        default: "0.25"
  workflow_call:
    inputs:
      stack_ref:
        description: "lightcone-cli ref to evaluate when it is not the triggering repository"
        type: string
        default: main
      skills_ref:
        description: "agent-skills ref to install when it is not the triggering repository"
        type: string
        default: main
      attempts:
        description: "Trials per leg"
        type: string
        default: "1"
      tolerance:
        description: "Allowed fractional increase of agent steps over main's median"
        type: string
        default: "0.25"
  pull_request:
    # `ready_for_review` beside the defaults, so flipping a draft to ready
    # triggers the run the draft guard below skips.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Only one eval per PR at a time — cancel in-progress runs
concurrency:
  group: eval-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  HARBOR_VERSION: 0.22.0
  STACK_REPO: LightconeResearch/lightcone-cli
  SKILLS_REPO: LightconeResearch/agent-skills

jobs:
  prepare:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out lightcone-cli
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STACK_REPO }}
          ref: ${{ github.repository == env.STACK_REPO && (github.event.pull_request.head.sha || github.sha) || inputs.stack_ref || 'main' }}
          path: stack
          # Full history so hatch-vcs sees the tags and stamps a truthful
          # dev version into the wheel (and every manifest's lc_version),
          # and so the change under test can be described
          fetch-depth: 0

      - name: Check out agent-skills
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ github.repository == env.SKILLS_REPO && (github.event.pull_request.head.sha || github.sha) || inputs.skills_ref || 'main' }}
          path: skills-src
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Assemble the eval inputs
        env:
          EVENT_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p bundle/skills
          cp -r stack/evals/snae-build bundle/task
          cp stack/.github/scripts/eval_report.py stack/evals/trace-analysis-prompt.md bundle/
          # The engine under test, built from its checkout: the task image
          # installs exactly this wheel
          uv build --wheel --project stack -o bundle/task/environment/lc-wheel

          # Every built skill bundle, first of each name: plugins bundle
          # their dependencies, so one skill can appear in several
          for d in skills-src/plugins/*/skills/*/; do
            name=$(basename "$d")
            [ -f "${d}SKILL.md" ] && [ ! -e "bundle/skills/$name" ] && cp -r "$d" "bundle/skills/$name"
          done
          ls bundle/skills | grep -q . || { echo "::error::no skill bundles in $SKILLS_REPO"; exit 1; }

          case "${EVENT_REPO,,}" in
            "${STACK_REPO,,}") changed=stack ;;
            "${SKILLS_REPO,,}") changed=skills-src ;;
            *) changed= ;;
          esac
          jq -n \
            --arg stack "$STACK_REPO@$(git -C stack rev-parse --short HEAD)" \
            --arg skills "$SKILLS_REPO@$(git -C skills-src rev-parse --short HEAD)" \
            --arg skill_set "$(ls bundle/skills | paste -sd, -)" \
            --arg sha "$(git -C "${changed:-stack}" rev-parse HEAD)" \
            '{stack: $stack, skills: $skills, skill_set: $skill_set, sha: $sha}' > bundle/refs.json
          cat bundle/refs.json

          # What the analyst blames a regression on: the commits and files
          # of the repository under test since its base
          {
            if [ -n "$changed" ] && [ -n "$BASE_SHA" ] \
                && git -C "$changed" cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo "Repository under test: $EVENT_REPO"
              echo
              echo '```'
              git -C "$changed" log --oneline "$BASE_SHA..HEAD" | head -50
              echo
              git -C "$changed" diff --stat "$BASE_SHA...HEAD" | tail -60
              echo '```'
            else
              echo "No base commit to compare against for this event."
            fi
          } > bundle/changes.md

      - uses: actions/upload-artifact@v4
        with:
          name: eval-inputs
          path: bundle
          if-no-files-found: error

  oracle:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-inputs
          path: bundle

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Harbor
        run: uv tool install "harbor==$HARBOR_VERSION"

      - name: Run the reference solution
        run: harbor run -p bundle/task -a oracle -e docker -o jobs --job-name oracle -q -y

      - name: Require reward 1.0
        run: |
          jq -e '[.stats.evals[]
                  | (.n_errors // 0) == 0 and (.metrics[0].reward // 0) == 1.0]
                 | length > 0 and all' jobs/oracle/result.json \
            || { jq .stats jobs/oracle/result.json; echo "::error::oracle gate failed"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-oracle
          path: jobs
          if-no-files-found: warn

  agents:
    needs: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: claude-code, agent: claude-code, model: claude-sonnet-5-5, secret_name: CLAUDE_CODE_OAUTH_TOKEN }
          - { leg: codex,       agent: codex,       model: gpt-5.1-codex,     secret_name: OPENAI_API_KEY }
    steps:
      - name: Gate on the leg's secret
        id: gate
        env:
          LEG_KEY: ${{ secrets[matrix.secret_name] }}
        run: |
          mkdir -p "jobs/${{ matrix.leg }}"
          skipped=false
          if [ -z "$LEG_KEY" ]; then
            skipped=true
            echo "::notice::Skipping ${{ matrix.leg }} — secret ${{ matrix.secret_name }} is not set"
          fi
          echo "skip=$skipped" >> "$GITHUB_OUTPUT"
          jq -n --arg leg "${{ matrix.leg }}" --arg agent "${{ matrix.agent }}" \
            --arg model "${{ matrix.model }}" --argjson skipped "$skipped" \
            --arg reason "${{ matrix.secret_name }} not set" \
            '{leg: $leg, agent: $agent, model: $model, skipped: $skipped}
             + (if $skipped then {skip_reason: $reason} else {} end)' \
            > "jobs/${{ matrix.leg }}/leg.json"

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: eval-inputs
          path: bundle

      - name: Set up uv
        if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install Harbor
        if: steps.gate.outputs.skip != 'true'
        run: uv tool install "harbor==$HARBOR_VERSION"

      - name: Run the agent
        if: steps.gate.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_MAX_TURNS: "200"
        run: |
          skill_flags=()
          for d in bundle/skills/*/; do skill_flags+=(--skill "${d%/}"); done
          harbor run -p bundle/task \
            -a "${{ matrix.agent }}" -m "${{ matrix.model }}" \
            -e docker -k "${{ inputs.attempts || '1' }}" "${skill_flags[@]}" \
            -o "jobs/${{ matrix.leg }}" --job-name "${{ matrix.leg }}" -q -y

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-leg-${{ matrix.leg }}
          path: jobs/${{ matrix.leg }}
          if-no-files-found: warn

  report:
    needs: [prepare, agents]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-inputs
          path: bundle

      - uses: actions/download-artifact@v4
        with:
          pattern: eval-leg-*
          path: collected

      - name: Fetch main's latest results
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" \
                 --branch main --event push --status success --limit 1 \
                 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" \
               -n eval-results -D baseline; then
            echo "Baseline: run $id"
          else
            echo "::notice::No successful main run with eval-results yet — reporting without a baseline"
          fi

      - name: Summarize
        run: |
          mode=pr
          [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && mode=main
          python3 bundle/eval_report.py summarize --jobs collected --out report \
            --baseline baseline --refs bundle/refs.json --changes bundle/changes.md \
            --mode "$mode" --tolerance "${{ inputs.tolerance || '0.25' }}"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Skip first-run onboarding in headless mode
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"

      - name: Analyse the traces
        id: analysis
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # The analysis is part of the result: a leg without one fails the
          # job, after the comment says so
          status=ok
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set — no trace analysis"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for input in report/analysis-input-*.md; do
            [ -e "$input" ] || continue
            leg=${input#report/analysis-input-}; leg=${leg%.md}
            if ! timeout 600 claude -p "$(cat bundle/trace-analysis-prompt.md)" \
                   < "$input" > "report/analysis-$leg.md" \
                || ! [ -s "report/analysis-$leg.md" ]; then
              echo "::error::trace analysis failed for $leg"
              rm -f "report/analysis-$leg.md"
              status=failed
            fi
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Build the report
        if: always()
        run: |
          python3 bundle/eval_report.py comment --out report
          cat report/comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: report
          if-no-files-found: warn

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('report/comment.md', 'utf8');
            // GitHub rejects comments over 65536 characters
            if (body.length > 65000) {
              body = body.slice(0, 65000) + '\n\n_Truncated — full report in the eval-results artifact._';
            }
            body += `\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- lightcone-eval-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Gate
        run: |
          jq -r '.gate.reasons[]' report/results.json
          jq -e '.gate.ok' report/results.json > /dev/null
          [ "${{ steps.analysis.outputs.status }}" = ok ]
