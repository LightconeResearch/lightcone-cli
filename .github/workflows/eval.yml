name: Eval

# Agentic eval on Harbor. A task from LightconeResearch/lightcone-evals runs
# against the lightcone-cli and agent-skills under test: prepare pins the
# task image to the lightcone-cli commit and collects the skills, oracle
# requires the scripted solution to score 1.0, agents runs each harness with
# the skills installed, and report gates on reward, breakage and agent steps
# against main's history, then posts a trace analysis.
#
# Each leg is one Harbor agent: `legs` is a JSON list of {name, agent,
# model, secret, env?}, where `secret` names the secret exported under its
# own name and `env` adds variables (e.g. ANTHROPIC_BASE_URL). The default
# is one claude-code leg. `require_skills` fails a leg that never loaded a
# skill. agent-skills reuses the workflow, with its own PR as the side under
# test:
#
#   jobs:
#     eval:
#       uses: LightconeResearch/lightcone-cli/.github/workflows/eval.yml@main
#       secrets: inherit
#       with:
#         require_skills: true
#         legs: >-
#           [{"name": "claude-code", "agent": "claude-code", "model": "claude-sonnet-5-5", "secret": "CLAUDE_CODE_OAUTH_TOKEN"},
#            {"name": "opencode", "agent": "opencode", "model": "deepseek/deepseek-flash", "secret": "DEEPSEEK_API_KEY"}]
#
# The caller needs `pull-requests: write` and `actions: read`, and the same
# triggers as below.
# --skill installs the skill bundles only; plugin installs and hooks are
# agent-skills' e2e-hooks workflow's to test.

on:
  workflow_dispatch:
    inputs:
      stack_ref:
        description: "lightcone-cli ref, when it is not the triggering repository"
        default: main
      skills_ref:
        description: "agent-skills ref, when it is not the triggering repository"
        default: main
      tasks_ref:
        description: "lightcone-evals ref to fetch the task from"
        default: main
      legs:
        description: "JSON list of legs (see the header); empty means one claude-code leg"
        default: ""
      require_skills:
        description: "Fail a leg that never loaded a skill"
        type: boolean
        default: false
  workflow_call:
    inputs:
      stack_ref: { type: string, default: main }
      skills_ref: { type: string, default: main }
      tasks_ref: { type: string, default: main }
      legs: { type: string, default: "" }
      require_skills: { type: boolean, default: false }
  pull_request:
    # `ready_for_review` beside the defaults, so flipping a draft to ready
    # triggers the run the draft guard below skips.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Only one eval per PR at a time — cancel in-progress runs
concurrency:
  group: eval-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  HARBOR_VERSION: 0.22.0
  TASK: lightcone-cli/snae-build
  STACK_REPO: LightconeResearch/lightcone-cli
  SKILLS_REPO: LightconeResearch/agent-skills
  DEFAULT_LEGS: '[{"name": "claude-code", "agent": "claude-code", "model": "claude-sonnet-5-5", "secret": "CLAUDE_CODE_OAUTH_TOKEN"}]'

jobs:
  prepare:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - name: Resolve the legs
        id: legs
        env:
          LEGS: ${{ inputs.legs }}
        run: |
          legs=$(jq -c . <<< "${LEGS:-$DEFAULT_LEGS}") \
            && jq -e 'type == "array" and length > 0
                      and all(.[]; (.name, .agent, .model, .secret) | type == "string")' <<< "$legs" > /dev/null \
            || { echo "::error::legs must be a JSON list of {name, agent, model, secret, env?}"; exit 1; }
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

      # The triggering repository at its commit, with the history that
      # describes the change; the other at its input ref
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.STACK_REPO }}
          ref: ${{ github.repository == env.STACK_REPO && (github.event.pull_request.head.sha || github.sha) || inputs.stack_ref || 'main' }}
          fetch-depth: ${{ github.repository == env.STACK_REPO && '0' || '1' }}
          path: stack

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SKILLS_REPO }}
          ref: ${{ github.repository == env.SKILLS_REPO && (github.event.pull_request.head.sha || github.sha) || inputs.skills_ref || 'main' }}
          fetch-depth: ${{ github.repository == env.SKILLS_REPO && '0' || '1' }}
          path: skills

      - name: Check out lightcone-evals
        uses: actions/checkout@v4
        with:
          repository: LightconeResearch/lightcone-evals
          ref: ${{ inputs.tasks_ref || 'main' }}
          path: evals

      - name: Assemble the eval inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p bundle/skills

          # The task image installs lightcone-cli at its ARG LIGHTCONE_COMMIT=
          cp -r "evals/$TASK" bundle/task
          stack_sha=$(git -C stack rev-parse HEAD)
          grep -q '^ARG LIGHTCONE_COMMIT=' bundle/task/environment/Dockerfile \
            || { echo "::error::$TASK does not pin lightcone-cli with ARG LIGHTCONE_COMMIT="; exit 1; }
          sed -i "s|^ARG LIGHTCONE_COMMIT=.*|ARG LIGHTCONE_COMMIT=$stack_sha|" bundle/task/environment/Dockerfile

          # The built skill bundles, first of each name (plugins bundle
          # their dependencies, so one skill can appear twice)
          for d in skills/plugins/*/skills/*/; do
            name=$(basename "$d")
            [ -e "bundle/skills/$name" ] || cp -r "$d" "bundle/skills/$name"
          done

          changed=stack
          [ "${GITHUB_REPOSITORY,,}" = "${SKILLS_REPO,,}" ] && changed=skills
          jq -n --arg stack "$(git -C stack rev-parse --short HEAD)" \
            --arg skills "$(git -C skills rev-parse --short HEAD)" \
            --arg tasks "$(git -C evals rev-parse --short HEAD)" \
            --arg sha "$(git -C "$changed" rev-parse HEAD)" \
            '{"lightcone-cli": $stack, "agent-skills": $skills, "lightcone-evals": $tasks, sha: $sha}' \
            | tee bundle/refs.json

          # What the analyst can blame a change in behaviour on
          if [ -n "$BASE_SHA" ] && git -C "$changed" cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            { echo '```'
              git -C "$changed" log --oneline "$BASE_SHA..HEAD" | head -50
              git -C "$changed" diff --stat "$BASE_SHA...HEAD" | tail -40
              echo '```'; } > bundle/changes.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: eval-inputs
          path: bundle

  oracle:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-inputs
          path: bundle
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install "harbor==$HARBOR_VERSION"
      - name: Run the reference solution
        run: harbor run -p bundle/task -a oracle -e docker -o jobs --job-name oracle -q -y
      - name: Require reward 1.0
        run: |
          jq -e '[.stats.evals[] | (.n_errors // 0) == 0 and (.metrics[0].reward // 0) == 1.0]
                 | length > 0 and all' jobs/oracle/result.json \
            || { jq .stats jobs/oracle/result.json; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-oracle
          path: jobs

  agents:
    needs: [prepare, oracle]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.legs) }}
    steps:
      - name: Skip without the leg's secret
        id: gate
        env:
          KEY: ${{ secrets[matrix.secret] }}
        run: |
          mkdir -p "jobs/${{ matrix.name }}"
          skipped=false
          [ -n "$KEY" ] || { skipped=true; echo "::notice::Skipping ${{ matrix.name }}: ${{ matrix.secret }} is not set"; }
          echo "skip=$skipped" >> "$GITHUB_OUTPUT"
          jq -n --arg leg "${{ matrix.name }}" --argjson skipped "$skipped" \
            --arg reason "${{ matrix.secret }} not set" \
            '{leg: $leg, skipped: $skipped, skip_reason: $reason}' > "jobs/${{ matrix.name }}/leg.json"
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          name: eval-inputs
          path: bundle
      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.skip == 'false'
      - if: steps.gate.outputs.skip == 'false'
        run: uv tool install "harbor==$HARBOR_VERSION"
      - name: Run the agent
        if: steps.gate.outputs.skip == 'false'
        env:
          KEY: ${{ secrets[matrix.secret] }}
          LEG_ENV: ${{ toJSON(matrix.env) }}
          CLAUDE_CODE_MAX_TURNS: "200"
        run: |
          export "${{ matrix.secret }}=$KEY"
          while IFS= read -r kv; do export "$kv"; done \
            < <(jq -r '(. // {}) | to_entries[] | "\(.key)=\(.value)"' <<< "$LEG_ENV")
          skills=(); for d in bundle/skills/*/; do skills+=(--skill "${d%/}"); done
          harbor run -p bundle/task -a "${{ matrix.agent }}" -m "${{ matrix.model }}" "${skills[@]}" \
            -e docker -o "jobs/${{ matrix.name }}" --job-name "${{ matrix.name }}" -q -y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-leg-${{ matrix.name }}
          path: jobs/${{ matrix.name }}

  report:
    needs: [prepare, oracle, agents]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-inputs
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-leg-*
          path: collected

      - name: Fetch the history from main's latest successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$GITHUB_WORKFLOW" --branch main \
                 --event push --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -n eval-results -D baseline \
            || echo "::notice::No main history yet"

      - name: Summarize and gate
        env:
          ORACLE: ${{ needs.oracle.result }}
          REQUIRE_SKILLS: ${{ inputs.require_skills || false }}
        run: |
          shopt -s nullglob
          mode=pr
          [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ] && mode=main
          mkdir -p report rows
          [ -f baseline/history.json ] || { mkdir -p baseline; echo '{}' > baseline/history.json; }

          # One row per leg, from its trial's result.json and ATIF trajectory
          for d in collected/eval-leg-*/; do
            leg=$(jq -r .leg "$d/leg.json")
            if [ "$(jq -r .skipped "$d/leg.json")" = true ]; then
              jq '{leg, skipped: true, reason: .skip_reason}' "$d/leg.json" > "rows/$leg.json"
              continue
            fi
            trial=$(dirname "$(ls "$d"*/*/result.json 2>/dev/null | head -1)")
            traj="$trial/agent/trajectory.json"
            [ -f "$traj" ] && cp "$traj" "report/trace-$leg.json" || echo '{}' > "report/trace-$leg.json"
            jq -n --arg leg "$leg" --arg trial "$trial" \
              --slurpfile r "$trial/result.json" --slurpfile a "report/trace-$leg.json" '
              ($a[0].steps // []) as $steps
              | {leg: $leg, skipped: false, trial: $trial,
                 reward: $r[0].verifier_result.rewards.reward,
                 exception: ($r[0].exception_info
                   | if . then "\(.exception_type): \(.exception_message | tostring | .[:300])" else null end),
                 steps: ([$steps[] | select(.source == "agent")] | if length > 0 then length else null end),
                 skills: any($steps[].tool_calls[]?;
                   (.function_name | ascii_downcase) == "skill" or (.arguments | tostring | test("SKILL\\.md")))}' \
              > "rows/$leg.json" 2>/dev/null \
              || jq -n --arg leg "$leg" '{leg: $leg, skipped: false, reward: null, exception: "no trial result", steps: null}' > "rows/$leg.json"
          done

          # The gate: the oracle, reward and breakage always; off main, steps
          # more than 25% and 3 over the median of the leg's main history,
          # once three main runs are on record (one trial per leg is noisy)
          jq -s --arg oracle "$ORACLE" --arg mode "$mode" --argjson skills "$REQUIRE_SKILLS" \
            --slurpfile h baseline/history.json \
            --slurpfile refs bundle/refs.json '
            def median: sort | if length % 2 == 1 then .[length / 2 | floor]
                               else (.[length / 2 - 1] + .[length / 2]) / 2 end;
            map(if .skipped then . else
                  .history = [$h[0][.leg][]?.steps]
                  | .median = (if (.history | length) > 0 then (.history | median) else null end) end)
            | {refs: $refs[0], legs: ., reasons: (
                (if $oracle != "success" then ["reference solution: \($oracle) — the task or the stack is broken"]
                 elif all(.[]; .skipped) then ["no agent leg ran"] else [] end)
                + [.[] | select(.skipped | not)
                   | (if .exception then "\(.leg): errored — \(.exception)" else empty end),
                     (if (.reward // 0) < 1 then "\(.leg): reward \(.reward) < 1.0" else empty end),
                     (if $skills and (.skills | not) then "\(.leg): no skill was loaded" else empty end),
                     (if $mode == "pr" and (.history | length) >= 3 then
                        if .steps == null then "\(.leg): no trajectory, steps cannot be compared"
                        elif .steps > .median * 1.25 and .steps - .median >= 3
                        then "\(.leg): \(.steps) agent steps against a main median of \(.median)"
                        else empty end
                      else empty end)])}' rows/*.json < /dev/null > report/results.json
          jq -r '.reasons[]' report/results.json

          # Main runs append to the history the next run compares against
          if [ "$mode" = main ]; then
            jq --slurpfile h baseline/history.json --arg sha "$(jq -r .sha bundle/refs.json)" '
              reduce (.legs[] | select(.steps != null)) as $l ($h[0];
                .[$l.leg] = ((.[$l.leg] // []) + [{sha: $sha, steps: $l.steps}])[-10:])' \
              report/results.json > report/history.json
          fi

      - name: Analyse the traces
        id: analysis
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # The analysis is part of the result: a leg without one fails the job
          legs=$(jq -r '.legs[] | select(.skipped | not) | select(.trial) | .leg' report/results.json)
          [ -n "$legs" ] || exit 0
          curl -fsSL https://claude.ai/install.sh | bash
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"
          cat > prompt.md <<'EOF'
          You are reviewing one leg of an automated eval: an autonomous coding
          agent was given a task instruction and had to carry it out with the
          `astra` (spec) and `lc` (execution) CLIs, guided only by that
          instruction, the Lightcone agent skills installed into its harness, and
          the CLIs' own help. The message lists the files to read: the
          instruction, this run's ATIF trajectory (JSON: `steps`, each with
          `tool_calls` and an `observation`), the verifier's output, the change
          under test, and, when present, the trajectory of the latest successful
          main run of the same leg. Read them before answering.

          Explain *why* this run went the way it did, so a reviewer can act on it
          without opening the trace. Cite trajectory steps as `step N` and quote
          output verbatim where it matters. Do not restate the task, do not
          summarize a successful build, and do not pad. Write exactly these two
          markdown sections and nothing else:

          #### Confusion & pain points

          3-6 concise bullets: what happened, its root cause, and the fix it
          suggests when one is clear. Look for failed commands and their cause;
          misunderstandings of the spec format, the CLI, the sandbox or the
          environment; whether the skills were loaded and told the agent what it
          needed, or it fell back to `--help`, source reading or trial and error;
          detours; and workarounds that hint at a gap lightcone-cli, the skills or
          the eval setup should fix. If the run was essentially clean, say so in
          one bullet.

          #### What changed vs main

          Only with a main trajectory: where the extra or missing steps are, the
          first point where the two runs diverge, and which commit or file in the
          change under test most plausibly caused it — or say plainly that it
          looks like agent variance, and why. If reward or breakage changed,
          explain that first. Without a main trajectory, write one line saying so.
          EOF
          status=ok
          for leg in $legs; do
            trial=$(jq -r --arg l "$leg" '.legs[] | select(.leg == $l) | .trial' report/results.json)
            {
              echo "Leg: $leg. Summary: $(jq -c --arg l "$leg" '.legs[] | select(.leg == $l) | del(.trial)' report/results.json)"
              echo "- instruction: bundle/task/instruction.md"
              echo "- this run's trajectory: report/trace-$leg.json"
              echo "- verifier output: $trial/verifier/test-stdout.txt"
              [ -f bundle/changes.md ] && echo "- change under test: bundle/changes.md"
              [ -f "baseline/trace-$leg.json" ] && echo "- main's trajectory: baseline/trace-$leg.json"
            } > "input-$leg.txt"
            timeout 900 "$HOME/.local/bin/claude" -p "$(cat prompt.md)" --allowedTools Read Grep \
              < "input-$leg.txt" > "report/analysis-$leg.md" && [ -s "report/analysis-$leg.md" ] \
              || { echo "::error::trace analysis failed for $leg"; status=failed; }
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Build the report
        if: always()
        run: |
          {
            jq -r '"## \(if (.reasons | length) == 0 then "✅" else "❌" end) Eval\n\n<!-- lightcone-eval-report -->\n",
                   (.refs | to_entries | map("\(.key): `\(.value)`") | join(" · ")), "",
                   "| Leg | Reward | Agent steps | main median (runs) | Skills loaded |", "|---|---|---|---|---|",
                   (.legs[] | if .skipped then "| \(.leg) | skipped: \(.reason) | | | |"
                     else "| \(.leg) | \(.reward // "—") | \(.steps // "—") | \(.median // "—") (\(.history | length)) | \(if .skills then "yes" else "**no**" end) |" end),
                   "", (.reasons[] | "- ❌ \(.)"), ""' report/results.json
            for f in report/analysis-*.md; do
              [ -e "$f" ] || continue
              leg=${f#report/analysis-}; echo "### ${leg%.md}"; echo; cat "$f"; echo
            done
            echo "Steps are gated once three main runs are on record; trajectories are in the \`eval-results\` artifact."
          } > report/comment.md
          cat report/comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: report

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // GitHub rejects comments over 65536 characters
            const body = fs.readFileSync('report/comment.md', 'utf8').slice(0, 65000)
              + `\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- lightcone-eval-report -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Gate
        run: |
          jq -e '.reasons | length == 0' report/results.json > /dev/null
          [ "${{ steps.analysis.outputs.status }}" != failed ]
