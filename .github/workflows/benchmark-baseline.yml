# Copy to lightcone-cli:.github/workflows/benchmark-baseline.yml
# Every merge to main refreshes lightcone-bench's stored stack baseline (skills from
# agent-skills main installed, three attempts per agent, matching the PR runs it is
# compared with).
name: benchmark-baseline
on:
  push:
    branches: [main]
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.BENCH_DISPATCH_TOKEN }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/LightconeResearch/lightcone-bench/actions/workflows/benchmark.yml/dispatches \
            -d '{"ref":"main","inputs":{"task":"lightcone-cli/snae-build","use_skills":"true","attempts":"3","stack_ref":"${{ github.sha }}","save_baseline":true}}'
