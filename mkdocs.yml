site_name: Prism — Maintainer Documentation
site_description: Agentic execution layer for ASTRA research pipelines
site_author: Lightcone Research
repo_url: https://github.com/LightconeResearch/Prism
repo_name: LightconeResearch/Prism

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  # mkdocstrings is optional — requires `pip install mkdocstrings[python]` and Python 3.11+
  # Uncomment when building API reference with autodoc:
  # - mkdocstrings:
  #     handlers:
  #       python:
  #         options:
  #           show_source: true
  #           show_root_heading: true
  #           show_category_heading: true
  #           docstring_style: google

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - CLI Reference:
    - Overview: cli/index.md
    - Command Schematics: cli/schematics.md
    - prism init: cli/init.md
    - prism run: cli/run.md
    - prism build: cli/build.md
    - prism status: cli/status.md
    - prism dev: cli/dev.md
    - prism setup: cli/setup.md
    - prism target: cli/target.md
    - prism update: cli/update.md
  - Python API:
    - Overview: api/index.md
    - cli: api/cli.md
    - container: api/container.md
    - dagster/assets: api/assets.md
    - dagster/runner: api/runner.md
    - dagster/io_manager: api/io_manager.md
    - dagster/status: api/status.md
    - dagster/targets: api/targets.md
    - dagster/site_registry: api/site_registry.md
  - Skills:
    - Overview: skills/index.md
    - prism-new: skills/prism-new.md
    - prism-build: skills/prism-build.md
    - prism-verify: skills/prism-verify.md
    - prism-migrate: skills/prism-migrate.md
    - prism-feedback: skills/prism-feedback.md
    - Creating Skills: skills/authoring.md
  - Telemetry (Langfuse):
    - Overview: telemetry/index.md
    - Hooks Architecture: telemetry/hooks.md
    - Session Lifecycle: telemetry/lifecycle.md
    - Disabling Telemetry: telemetry/opt-out.md
  - HPC & SLURM:
    - Overview: hpc/index.md
    - Site Registry: hpc/site-registry.md
    - Target Configuration: hpc/targets.md
    - Container Builds: hpc/containers.md
  - Contributing:
    - Development Setup: contributing/setup.md
    - Adding a Backend: contributing/backends.md
    - Adding an HPC Site: contributing/hpc-sites.md
    - Testing: contributing/testing.md
