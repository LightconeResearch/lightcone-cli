# Full local demo: the with/without-Lightcone A/B across three harnesses on the
# snae task, run in local Docker. The matrix is {claude, codex, pi} x
# {with-skills, without-skills}. The report's "Δ lift" column is the headline —
# how much the Lightcone layer moved each harness's score.
#
# Codex runs on its default model — the "spark" model needs API-key auth and is
# rejected on a ChatGPT-account login (see first-smoke-findings). To use spark,
# add an OPENAI_API_KEY and set `model: gpt-5.3-codex-spark`. pi uses its default
# (free) provider/model. claude needs CLAUDE_CODE_OAUTH_TOKEN in the host env.
id: local-demo
backend: local_docker
tasks:
  - snae
harnesses:
  - claude
  - codex
  - pi
skill_variants: [true, false]
num_trials: 1
max_concurrency: 2
output_dir: eval-results
