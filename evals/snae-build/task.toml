schema_version = "1.4"
artifacts = []

[task]
name = "lightcone/snae-build"
version = "0.3.0"
description = "Build a seeded ASTRA analysis end to end with lightcone-cli: complete the deliberately incomplete spec, write the recipe scripts, declare dependencies, materialize every output through the engine, and prepare the project for publication."
keywords = ["astronomy", "lightcone-cli", "astra", "build-from-scratch", "naive-usage", "provenance"]
[[task.authors]]
name = "dkn16"
email = "dkn16@foxmail.com"

[metadata]
category = "natural-science"
difficulty = "medium"
# Inspired from LightconeResearch/lightcone-evals lightcone-cli/snae-build,
# itself a port of this repository's earlier eval. Installs the engine from a
# wheel the workflow builds out of the checkout under test, rather than a
# pinned git commit.
source_format = "lightcone-evals"

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
timeout_sec = 1200.0

[environment]
network_mode = "public"
build_timeout_sec = 1800.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[environment.env]

[solution.env]
