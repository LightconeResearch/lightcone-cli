# ASTRA Analysis Specification
# Documentation: https://github.com/LightconeResearch/ASTRA

version: "1.0"
name: "snae"
description: |
  Fit the Union2.1 Type Ia supernova distance modulus vs redshift data
  to a flat LCDM cosmological model with two free parameters (H0, Omega_L)
  using MCMC posterior inference. This provides cosmological parameter
  constraints as a building block for a larger analysis.

container:
  build: Containerfile

success_criteria:
  - claim: "MCMC chains are well converged"
    output: convergence
    condition: "Gelman-Rubin R-hat < 1.05 for both parameters"

inputs:
  - id: union21
    type: data
    source: "https://supernova.lbl.gov/Union/figures/SCPUnion2.1_mu_vs_z.txt"
    description: "Union2.1 SN Ia compilation: 580 supernovae with redshift, distance modulus, and uncertainties"

outputs:
  - id: chain
    type: data
    description: "MCMC posterior samples for H0 and Omega_L"
    recipe:
      command: python scripts/fit.py

  - id: posterior
    type: figure
    description: "2D posterior contour plot of H0 vs Omega_L"
    recipe:
      command: python scripts/plot_posterior.py
      inputs: [chain]

  - id: convergence
    type: metric
    description: "Convergence diagnostics: Gelman-Rubin R-hat and effective sample size for each parameter"
    recipe:
      command: python scripts/diagnostics.py
      inputs: [chain]

  - id: best_fit
    type: metric
    description: "Median parameter estimates with 68% credible intervals for H0 and Omega_L"
    recipe:
      command: python scripts/summarize.py
      inputs: [chain]

decisions:
  sampler:
    label: "MCMC Sampler"
    tags: [inference]
    rationale: "Ensemble MCMC (emcee) is the community default; nested sampling (dynesty) provides Bayesian evidence for model comparison, which may be useful downstream"
    default: emcee
    options:
      emcee:
        label: "emcee"
        description: "Affine-invariant ensemble sampler"
      dynesty:
        label: "dynesty"
        description: "Dynamic nested sampling; also yields Bayesian evidence"

  error_model:
    label: "Error Treatment"
    tags: [data]
    rationale: "Union2.1 provides both statistical-only and systematics-included uncertainties; choice directly affects posterior width"
    default: stat_and_sys
    options:
      stat_only:
        label: "Statistical errors only"
        description: "Use only the statistical distance modulus uncertainties"
      stat_and_sys:
        label: "Statistical + systematic errors"
        description: "Include systematic uncertainty contributions"

  redshift_cut:
    label: "Low-Redshift Cut"
    tags: [data]
    rationale: "SNe at z < 0.01 are dominated by peculiar velocity scatter rather than cosmological signal; standard practice varies on whether to exclude them"
    default: z_min_001
    options:
      none:
        label: "No cut"
        description: "Use all supernovae regardless of redshift"
      z_min_001:
        label: "z > 0.01"
        description: "Exclude supernovae with z < 0.01 to mitigate peculiar velocity contamination"
