[project]
name = "lightcone-cli"
dynamic = ["version"]
description = "Lightcone Research's agentic execution layer"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
authors = [
    { name = "Lightcone Research" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

# Clean rebuild: dependencies are re-added with the layer that needs
# them. Layer 1 (`lc init` scaffolding) needs the ASTRA spec tooling, the
# CLI framework, and console rendering — nothing else.
dependencies = [
    # Pinned: the spec scaffold delegates to astra's boilerplate helper,
    # whose surface has changed across releases (0.2.14 exposes the
    # public `create_boilerplate`). Bump deliberately.
    "astra-tools==0.2.14",
    "click>=8.0",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
docs = [
    "zensical>=0.0.33",
]


[project.scripts]
lc = "lightcone.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/lightcone"]

[tool.hatch.build.targets.sdist]
include = ["src/lightcone"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["astra.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
