[project]
name = "lightcone-cli"
dynamic = ["version"]
description = "Lightcone command-line toolchain"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
authors = [
    { name = "Lightcone Research" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

dependencies = [
    # Pinned: astra-tools 0.2.14 made `astra init` idempotent, changing
    # the callback signature this release's `lc init` delegates to.
    "astra-tools==0.2.11",
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.0",
    "snakemake>=9.0",
    "snakemake-interface-executor-plugins>=9.0",
    "snakemake-interface-common>=1.14",
    "dask>=2024.1",
    "distributed>=2024.1",
    # Dask Gateway client for JupyterHub/Kubernetes deployments. A
    # normal dependency (not an extra) so `lc run` works out of the box
    # on a hub and scaffolded project images inherit it via their
    # lightcone-cli pin.
    "dask-gateway>=2024.1",
    "rocrate>=0.11",
]

[dependency-groups]
eval = [
    "anthropic>=0.90",
    "build>=1.0",
    "daytona-sdk>=0.140",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]
docs = [
    "zensical>=0.0.33",
    # squidfunk's mike fork — required by zensical's versioning provider.
    # Not on PyPI; install from git.
    "mike @ git+https://github.com/squidfunk/mike.git ; python_version >= '3.10'",
]

# Versioning is handled by mike (https://github.com/squidfunk/mike).
# Each version of the site is deployed as a subdirectory under site_url
# (e.g. /0.0.9/, /latest/). The picker is rendered natively in the header.
[project.extra.version]
provider = "mike"

[project.scripts]
lc = "lightcone.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = [
    "src/lightcone",
    "src/snakemake_executor_plugin_dask",
]

[tool.hatch.build.targets.wheel.force-include]
"claude/lightcone" = "lightcone/cli/claude/lightcone"

[tool.hatch.build.targets.sdist]
include = [
    "src/lightcone",
    "src/snakemake_executor_plugin_dask",
    "claude/lightcone",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["dask.*", "distributed.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
# Untyped and without explicit re-exports; skip so `from dask_gateway
# import Gateway` doesn't trip strict no_implicit_reexport.
module = ["dask_gateway", "dask_gateway.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["rocrate.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["astra.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["daytona_sdk", "daytona_sdk.*", "dotenv", "dotenv.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that spin up real subsystems (dask cluster, etc.) — opt-in via -m slow",
]
