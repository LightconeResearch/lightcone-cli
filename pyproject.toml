[project]
name = "lightcone-cli"
dynamic = ["version"]
description = "Lightcone Research's agentic execution layer"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
authors = [
    { name = "Lightcone Research" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

# astra-tools 0.3.0rc2 is the first release with the `resolve` and `status`
# API this engine is built on. astra-spec is a direct dependency only for
# its specifier: 0.1 is a release candidate, which a resolver takes for a
# package it is asked for by such a version.
dependencies = [
    "astra-tools>=0.3.0rc2",
    "astra-spec>=0.1.0rc1,<0.2",
    "click>=8.0",
    "rich>=13.0",
    "git-annex>=10.2026",
    "distributed>=2026.7",
    "rocrate>=0.15",
    "cryptography>=44",
    "psutil>=6",
    "pydantic>=2.9,<3",
    "pyyaml>=6",
    "jupyter-server>=2.21",
    "jupyterlab-server>=2.28",
    "jupyter-live-content>=0.1.2,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "hatchling",
    "playwright>=1.58",
    "ruff",
    "mypy",
    "datalad",
    "roc-validator>=0.11.4",
    "types-pyyaml>=6.0.12.20260906",
    "types-psutil>=7.2.2.20260906",
]

# The head of astra-project/astra-tools' `resolve-commit-files` until it is
# released: `resolve(commits=...)` gives a command to a result that reads a
# result from a commit.
[tool.uv.sources]
astra-tools = { git = "https://github.com/astra-project/astra-tools", rev = "1bf275c7ae9a9427d98a664a4dda06e8fce6d93d" }


[project.urls]
Repository = "https://github.com/LightconeResearch/lightcone-cli"

[project.scripts]
lc = "lightcone.cli:main"
# The git-annex wheel's own entry points, re-declared verbatim: an
# installer links only the requested package's executables, and a plain
# `uv tool install lightcone-cli` must put git-annex on the shell's PATH
# — `filter=annex` makes the researcher's own `git add` need it. The
# suite pins these against the wheel's, so an upstream change fails
# loudly here rather than silently at install time.
git-annex = "git_annex:cli"
git-annex-shell = "git_annex:cli"
git-remote-annex = "git_annex:cli"
git-remote-tor-annex = "git_annex:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/lightcone"]
# The app's front end, built from ui/ and gitignored.
artifacts = ["src/lightcone/app/static"]

[tool.hatch.build.targets.sdist]
include = ["src/lightcone", "hatch_build.py"]
artifacts = ["src/lightcone/app/static"]

# Checkout distributions rebuild all frontend inputs. Prebuilt sdists need
# no Node, and editable installs leave the optional frontend build explicit.
[tool.hatch.build.hooks.custom]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rocrate.*"]
ignore_missing_imports = true
follow_untyped_imports = true

# rocrate ships no type information, and engine/crate.py is a client of
# little else — one module-scoped relaxation beats an ignore on every call.
[[tool.mypy.overrides]]
module = ["lightcone.engine.crate"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The container smoke tests leave ~200 MB image archives in each test's
# tmp_path; keeping every passing run's directories exhausts a tmpfs.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
