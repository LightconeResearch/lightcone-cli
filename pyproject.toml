[project]
name = "lightcone-cli"
dynamic = ["version"]
description = "Lightcone Research's agentic execution layer"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
authors = [
    { name = "Lightcone Research" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "astra-tools==0.2.17",
    "click>=8.0",
    "rich>=13.0",
    "distributed>=2026.7",
    "rocrate>=0.15",
]

[project.optional-dependencies]
# git-annex is a system tool, not a Python library — see require_git_annex()
# in engine/project.py for why it isn't a plain dependency. This extra is
# for hosts where a bundled build is genuinely the easiest path (its
# manylinux wheels need glibc>=2.34; a distro package or conda-forge build
# is usually the better fit on an older host).
bundled-annex = [
    "git-annex>=10.2026",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "datalad",
    "roc-validator>=0.11.3",
]
docs = [
    "zensical>=0.0.33",
    # squidfunk's mike fork — required by zensical's versioning provider.
    # Not on PyPI; install from git.
    "mike @ git+https://github.com/squidfunk/mike.git ; python_version >= '3.10'",
]


[project.urls]
Repository = "https://github.com/LightconeResearch/lightcone-cli"

[project.scripts]
lc = "lightcone.cli:main"
# git-annex is no longer bundled by default (see require_git_annex() in
# engine/project.py) — its own wheel declares `git-annex` / `git-annex-shell`
# / `git-remote-annex` / `git-remote-tor-annex` console-scripts already, so
# `uv tool install 'lightcone-cli[bundled-annex]'` gets them from there. Not
# re-declaring them here avoids shipping broken shims (importing a module
# that isn't installed) on hosts that skip the extra and use a distro
# package or conda-forge build instead — which would also collide on PATH
# with a real git-annex install in the same bin directory.

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/lightcone"]

[tool.hatch.build.targets.sdist]
include = ["src/lightcone"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["astra.*", "rocrate.*"]
ignore_missing_imports = true
follow_untyped_imports = true

# rocrate ships no type information, and engine/crate.py is a client of
# little else — one module-scoped relaxation beats an ignore on every call.
[[tool.mypy.overrides]]
module = ["lightcone.engine.crate"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The container smoke tests leave ~200 MB image archives in each test's
# tmp_path; keeping every passing run's directories exhausts a tmpfs.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
