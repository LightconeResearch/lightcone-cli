[project]
name = "lightcone-cli"
dynamic = ["version"]
description = "Lightcone command-line toolchain"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.11"
authors = [
    { name = "Lightcone Research" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # Pinned: astra-tools 0.2.14 made `astra init` idempotent, changing
    # the callback signature this release's `lc init` delegates to.
    "astra-tools==0.2.11",
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "jinja2>=3.0",
    "snakemake>=9.0",
    "snakemake-interface-executor-plugins>=9.0",
    "snakemake-interface-common>=1.14",
    "dask>=2024.1",
    "distributed>=2024.1",
    "rocrate>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]
docs = [
    "zensical>=0.0.33",
]


[project.scripts]
lc = "lightcone.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = [
    "src/lightcone",
    "src/snakemake_executor_plugin_dask",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/lightcone",
    "src/snakemake_executor_plugin_dask",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["dask.*", "distributed.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["rocrate.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["astra.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that spin up real subsystems (dask cluster, etc.) — opt-in via -m slow",
    "darwin: macOS-only enforcement smoke (runs in the macOS CI workflow)",
    "podman: needs a working rootless podman — opt-in via -m podman",
]
